name: Build and Deploy to Azure Container Instances

on:
  push:
    branches: [develop]

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE_NAME: ${{ github.repository }}-frontend
  BACKEND_IMAGE_NAME: ${{ github.repository }}-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Extract metadata for frontend
      id: frontend-meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-

    - name: Extract metadata for backend
      id: backend-meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-

    - name: Build and push frontend Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./ai-evaluator-frontend
        file: ./ai-evaluator-frontend/Dockerfile
        push: true
        tags: ${{ steps.frontend-meta.outputs.tags }}
        labels: ${{ steps.frontend-meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push backend Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./ai-evaluator-backend
        file: ./ai-evaluator-backend/Dockerfile
        push: true
        tags: ${{ steps.backend-meta.outputs.tags }}
        labels: ${{ steps.backend-meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Log in to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy backend to Azure Container Instances
      uses: azure/aci-deploy@v1
      with:
        resource-group: ${{ secrets.AZURE_RESOURCE_GROUP }}
        dns-name-label: ${{ secrets.AZURE_APP_NAME }}-backend
        image: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:develop-${{ github.sha }}
        registry-login-server: ${{ env.REGISTRY }}
        registry-username: ${{ github.actor }}
        registry-password: ${{ secrets.GITHUB_TOKEN }}
        name: ${{ secrets.AZURE_APP_NAME }}-backend
        location: ${{ secrets.AZURE_LOCATION }}
        ports: 8000
        environment-variables: PYTHONUNBUFFERED=1
        cpu: 0.5
        memory: 1.0

    - name: Deploy frontend to Azure Container Instances
      uses: azure/aci-deploy@v1
      with:
        resource-group: ${{ secrets.AZURE_RESOURCE_GROUP }}
        dns-name-label: ${{ secrets.AZURE_APP_NAME }}-frontend
        image: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:develop-${{ github.sha }}
        registry-login-server: ${{ env.REGISTRY }}
        registry-username: ${{ github.actor }}
        registry-password: ${{ secrets.GITHUB_TOKEN }}
        name: ${{ secrets.AZURE_APP_NAME }}-frontend
        location: ${{ secrets.AZURE_LOCATION }}
        ports: 80
        environment-variables: VITE_API_BASE_URL=https://${{ secrets.AZURE_APP_NAME }}-backend.${{ secrets.AZURE_LOCATION }}.azurecontainer.io:8000
        cpu: 0.5
        memory: 1.0

    - name: Output deployment URLs
      run: |
        echo "Backend deployed to: https://${{ secrets.AZURE_APP_NAME }}-backend.${{ secrets.AZURE_LOCATION }}.azurecontainer.io:8000"
        echo "Frontend deployed to: https://${{ secrets.AZURE_APP_NAME }}-frontend.${{ secrets.AZURE_LOCATION }}.azurecontainer.io"