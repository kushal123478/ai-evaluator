version: '3.8'

services:
  backend:
    build: ./ai-evaluator-backend
    ports:
      - "8000:8000"   # HTTP
    volumes:
      - ./ai-evaluator-backend/test-data:/app/test-data
      - ./ai-evaluator-backend/uploads:/app/uploads
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000

  frontend:
    build: 
      context: ./ai-evaluator-frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "80:80"       # HTTP
    depends_on:
      - backend